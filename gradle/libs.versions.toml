[versions]
# AGP 8.13 is the newest line that runs on Gradle 8.14; AGP 9 needs Gradle 9.
agp = "8.13.2"
kotlin = "2.2.21"
coroutines = "1.10.2"
serialization = "1.9.0"
okhttp = "5.5.1"
# Newer Kable releases are compiled against Kotlin 2.4 metadata.
kable = "0.42.0"
compose-bom = "2025.12.01"
activity-compose = "1.12.2"
lifecycle = "2.10.0"
core-ktx = "1.17.0"
work = "2.11.0"
datastore = "1.1.7"
junit = "5.14.4"
# 4.17 runs SDK 36 (compileSdk); JVM screen tests only.
robolectric = "4.17"
sshj = "0.41.2"
sshd = "2.15.0"
hivemq-mqtt = "1.4.1"
moquette = "0.17"
documentfile = "1.1.0"
ktlint-gradle = "14.2.0"
ktlint-engine = "1.8.0"
# Read by settings.gradle.kts, which cannot use the catalog's accessors.
foojay-resolver = "1.0.0"
test-retry = "1.6.6"

[libraries]
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
okhttp-mockwebserver = { module = "com.squareup.okhttp3:mockwebserver3", version.ref = "okhttp" }
# Test-only certificates, so app tests can serve the https-only OIDC issuer from MockWebServer.
okhttp-tls = { module = "com.squareup.okhttp3:okhttp-tls", version.ref = "okhttp" }
kable-core = { module = "com.juul.kable:kable-core", version.ref = "kable" }
# SFTP sink (Apache-2.0); the Keystore P-256 key is handed in as a java.security.PrivateKey.
sshj = { module = "com.hierynomus:sshj", version.ref = "sshj" }
# Embedded SSH/SFTP server for core tests only.
sshd-core = { module = "org.apache.sshd:sshd-core", version.ref = "sshd" }
sshd-sftp = { module = "org.apache.sshd:sshd-sftp", version.ref = "sshd" }
# MQTT sink (Apache-2.0); moquette is an embedded broker for core tests only.
hivemq-mqtt-client = { module = "com.hivemq:hivemq-mqtt-client", version.ref = "hivemq-mqtt" }
moquette-broker = { module = "io.moquette:moquette-broker", version.ref = "moquette" }

androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4" }
# Declares the empty activity createComposeRule launches.
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "core-ktx" }
androidx-work-runtime-ktx = { module = "androidx.work:work-runtime-ktx", version.ref = "work" }
androidx-datastore-preferences = { module = "androidx.datastore:datastore-preferences", version.ref = "datastore" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "documentfile" }

junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }
# Runs the JUnit 4 Robolectric screen tests on the JUnit Platform beside Jupiter.
junit-vintage-engine = { module = "org.junit.vintage:junit-vintage-engine" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
# The ktlint engine the Gradle plugin runs; listed as a library only so Renovate tracks its version.
ktlint-cli = { module = "com.pinterest.ktlint:ktlint-cli", version.ref = "ktlint-engine" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlint-gradle" }
foojay-resolver = { id = "org.gradle.toolchains.foojay-resolver-convention", version.ref = "foojay-resolver" }
test-retry = { id = "org.gradle.test-retry", version.ref = "test-retry" }
