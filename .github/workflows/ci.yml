name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs opt into what they need.
permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      # action-junit-report publishes failures as a check run with annotations.
      checks: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-build
      # The runner image ships an Android SDK; the build fetches platform 37 if missing. The
      # release variant is unsigned and exercises R8 and resource shrinking.
      - run: >-
          ./gradlew
          :core:test :fakes:test :app:testDebugUnitTest ktlintCheck
          :app:lintDebug :app:lintRelease
          :app:assembleDebug :app:assembleRelease
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: reports
          path: |
            **/build/reports/**
            **/build/test-results/**
          retention-days: 7
          if-no-files-found: ignore
      - uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: ${{ !cancelled() }}
        with:
          report_paths: "**/build/test-results/**/TEST-*.xml"
          # A pull request from a fork gets a read-only token and can't create a check run, so
          # it gets workflow annotations only.
          annotate_only: ${{ github.event.pull_request.head.repo.fork == true }}
          detailed_summary: true
          include_passed: false

  reproducible-build:
    # Two different runner images, so paths, kernel, locale and preinstalled tools differ.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: assemble
        uses: ./.github/actions/assemble-release
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apk-${{ matrix.os }}
          path: ${{ steps.assemble.outputs.apk }}
          retention-days: 3
          if-no-files-found: error

  reproducible-compare:
    needs: reproducible-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions: {}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: apk-*
          path: apks
      - name: Compare SHA-256 of the unsigned APKs
        run: |
          sha256sum apks/*/app-release-unsigned.apk | tee sums.txt
          if [ "$(cut -d' ' -f1 sums.txt | sort -u | wc -l)" -ne 1 ]; then
            echo "::error::Unsigned release APKs differ between runners; entries whose CRC or size differ:"
            set -- apks/*/app-release-unsigned.apk
            diff <(unzip -v "$1" | awk 'NR>3 {print $1, $7, $8}') \
                 <(unzip -v "$2" | awk 'NR>3 {print $1, $7, $8}') || true
            exit 1
          fi

  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      # Lists the commits of a pull request to scan.
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Commenting would need pull-requests: write; findings fail the job and land in its
          # summary instead.
          GITLEAKS_ENABLE_COMMENTS: "false"
