name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
      # The runner image ships an Android SDK; the build fetches platform 36 if missing.
      - run: ./gradlew :core:test :fakes:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
